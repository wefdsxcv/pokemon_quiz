<ng-container *ngIf="showSharedLayout; else homeLayout">
  <app-header></app-header>

  <div class="layout">
    <app-side-menu></app-side-menu>

    <main>
      <router-outlet></router-outlet>
    </main>
  </div>
</ng-container>

<ng-template #homeLayout>
  <main class="home-layout">
    <router-outlet></router-outlet>
  </main>
</ng-template>
