<section class="quiz">
  <header *ngIf="!isFinished" class="question">
    <h1>{{ question }}</h1>
  </header>

  <div *ngIf="isLoading" class="loading" role="status">
    次の問題を読み込んでいます...
  </div>

  <p *ngIf="getRegionNotice()" class="region-notice" role="status">
    {{ getRegionNotice() }}
  </p>

  <section *ngIf="isFinished" class="result">
    <h2>けっか</h2>
    <p>{{ settings.questionCount }}問中 {{ correctCount }}問正解</p>
    <p>
      正解率：
      {{ (correctCount / settings.questionCount * 100) | number: '1.0-0' }}%
    </p>
    <p *ngIf="resultMessage" class="result-error" role="alert">
      {{ resultMessage }}
    </p>
    <button type="button" class="restart" (click)="startQuiz()">
      もう一度遊ぶ
    </button>
  </section>

  <form
    *ngIf="!isLoading && !isFinished"
    class="quiz-content"
    [formGroup]="quizForm"
  >
    <div class="pokemon-image-container">
      <ng-container
        *ngIf="currentPokemon as pokemon; else imagePlaceholder"
      >
        <img
          class="pokemon-image"
          [src]="pokemon.imagePath"
          [alt]="pokemon.name"
        />
      </ng-container>
      <ng-template #imagePlaceholder>
        <div class="pokemon-image-placeholder">
          画像準備中
        </div>
      </ng-template>
    </div>

    <div class="details">
      <label *ngIf="settings.questionType !== 'name'">
        <span>なまえ：</span>
        <input type="text" formControlName="name" readonly />
      </label>

      <label *ngIf="settings.questionType !== 'type'">
        <span>タイプ：</span>
        <input type="text" formControlName="types" readonly />
      </label>

      <label>
        <span>しんか：</span>
        <input type="text" formControlName="evolution" readonly />
      </label>

      <label *ngIf="settings.questionType !== 'ability'">
        <span>とくせい：</span>
        <input type="text" formControlName="ability" readonly />
      </label>

      <label>
        <span>かくれとくせい：</span>
        <input type="text" formControlName="hiddenAbility" readonly />
      </label>
    </div>

    <div class="answers">
      <button
        *ngFor="let answer of answers; let index = index"
        type="button"
        [class]="'answer ' + answerColorClasses[index]"
        (click)="register(answer)"
      >
        {{ answer }}
      </button>
    </div>
  </form>
</section>
