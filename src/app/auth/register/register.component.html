<section class="register">
  <div class="register-card">
    <h1>新規登録</h1>
    <p class="description">
      ポケモンクイズを始めるにはアカウント登録が必要です。
    </p>

    <form [formGroup]="registerForm" (ngSubmit)="register()">
      <label>
        <span>メールアドレス</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="example@example.com"
        />
        <small
          *ngIf="
            registerForm.controls.email.invalid &&
            registerForm.controls.email.touched
          "
          class="error"
        >
          正しいメールアドレスを入力してください。
        </small>
      </label>

      <label>
        <span>パスワード（8文字以上）</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="new-password"
          placeholder="パスワードを入力"
        />
        <small
          *ngIf="
            registerForm.controls.password.invalid &&
            registerForm.controls.password.touched
          "
          class="error"
        >
          パスワードは8文字以上で入力してください。
        </small>
      </label>

      <fieldset>
        <legend>学校区分</legend>
        <div class="school-types">
          <button
            type="button"
            [class.selected]="
              registerForm.controls.schoolType.value === 'elementary'
            "
            (click)="selectSchoolType('elementary')"
          >
            小学生
          </button>
          <button
            type="button"
            [class.selected]="
              registerForm.controls.schoolType.value === 'juniorHigh'
            "
            (click)="selectSchoolType('juniorHigh')"
          >
            中学生
          </button>
          <button
            type="button"
            [class.selected]="
              registerForm.controls.schoolType.value === 'highSchool'
            "
            (click)="selectSchoolType('highSchool')"
          >
            高校生
          </button>
          <button
            type="button"
            [class.selected]="
              registerForm.controls.schoolType.value === 'other'
            "
            (click)="selectSchoolType('other')"
          >
            その他
          </button>
        </div>
      </fieldset>

      <button type="submit" class="register-button" [disabled]="isLoading">
        {{ isLoading ? '登録中...' : '新規登録' }}
      </button>
    </form>

    <p *ngIf="message" class="message" role="status">
      {{ message }}
    </p>

    <a routerLink="/login" class="back-link">
      ログイン画面へ戻る
    </a>
  </div>
</section>
